name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MoonBit check, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        run: moon update

      - name: Check (wasm)
        run: moon check --target wasm

      - name: Build (wasm)
        run: moon build --target wasm

      - name: Test (wasm, full suite)
        run: moon test --target wasm

      - name: Test (wasm-gc, pure logic)
        run: moon test --target wasm-gc

      - name: Demo (walking skeleton)
        run: moon run cmd/moonrv --target wasm -- demo

  # Differential verification: regenerate the random-program corpus against
  # qemu-riscv32 (the reference oracle) on every run, then replay it in moonrv.
  # A mismatch means moonrv disagrees with QEMU on RV32IM semantics.
  differential:
    name: Differential vs qemu-riscv32
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install QEMU + RISC-V cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user gcc-riscv64-unknown-elf

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update registry
        run: moon update

      - name: Regenerate corpus against QEMU (seeded, reproducible)
        run: python3 scripts/gen_diff.py suite/diff_wbtest.mbt

      - name: Replay corpus in moonrv (wasm)
        run: moon test --target wasm